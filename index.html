
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techy Store | متجر تكي</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
header { background-color: #2c3e50; color: white; padding: 20px 0; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
nav { display: flex; justify-content: center; background-color: #34495e; padding: 10px 0; }
nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
.container { max-width: 1200px; margin: 20px auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
.product-card { background-color: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s ease; text-align: center; padding: 15px; }
.product-card:hover { transform: translateY(-5px); }
.product-card img { max-width: 100%; height: auto; border-radius: 8px; }
.product-card h3 { margin: 15px 0 10px; color: #2c3e50; }
.product-card p { color: #888; font-size: 0.9em; margin-bottom: 15px; }
.price { font-size: 1.2em; font-weight: bold; color: #27ae60; margin-bottom: 15px; }
.btn { display: inline-block; background-color: #3498db; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; transition: background-color 0.3s; }
.btn:hover { background-color: #2980b9; }
footer { text-align: center; padding: 20px; background-color: #2c3e50; color: white; margin-top: 40px; }
</style>
</head>
<body>
<header>
<h1>Techy Store</h1>
</header>
<nav>
<a href="#">الرئيسية</a>
<a href="#">الإلكترونيات</a>
<a href="#">الاكسسوارات</a>
<a href="#">اتصل بنا</a>
</nav>
<div class="container">
<div class="product-card">
<h3>هاتف ذكي متطور</h3>
<p>أحدث الهواتف الذكية بأفضل المواصفات.</p>
<div class="price">3500 د.ل</div>
<a href="#" class="btn">اشترِ الآن</a>
</div>
<div class="product-card">
<h3>سماعات لاسلكية</h3>
<p>استمتع بصوت نقي وعالي الجودة.</p>
<div class="price">450 د.ل</div>
<a href="#" class="btn">اشترِ الآن</a>
</div>
<div class="product-card">
<h3>ساعة ذكية</h3>
<p>تتبع صحتك ونشاطك اليومي.</p>
<div class="price">650 د.ل</div>
<a href="#" class="btn">اشترِ الآن</a>
</div>
</div>
<footer>
<p>جميع الحقوق محفوظة © 2026 Techy Store</p>
</footer>
</body>
</html>
